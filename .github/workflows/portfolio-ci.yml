name: Portfolio quality checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: TypeScript and production build
        run: npm run build
      - name: Dependency security audit (diagnostic)
        run: npm audit --audit-level=high || true
      - name: Generate security-patched lockfile for review
        run: |
          npm audit fix --package-lock-only
          echo 'PORTFOLIO_LOCKFILE_BEGIN'
          cat package-lock.json
          echo 'PORTFOLIO_LOCKFILE_END'
      - name: Verify built SEO pages
        run: node scripts/check-dist.mjs
